name: CI Matrix Test Reports

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest and Generate Report
        run: pytest -v -s --html=artifacts/reports/pytest_report.html --self-contained-html

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        # Preserve evidence even if tests fail
        if: always()
        with:
          # Dynamic name using the matrix variable!
          name: ci-test-report-python-${{ matrix.python-version }}
          path: artifacts/